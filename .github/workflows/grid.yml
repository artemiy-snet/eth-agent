name: grid

# Бектест сіткового бота за 7 років (порівняння з нашими стратегіями). Actions → grid → Run workflow.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Початок, YYYY-MM"
        required: false
        default: "2019-01"
      end:
        description: "Кінець, YYYY-MM"
        required: false
        default: "2026-09"

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[research]"
      - name: Період
        id: args
        env:
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          python - <<'PY'
          import os, re
          s, e = os.environ["IN_START"].strip() or "2019-01", os.environ["IN_END"].strip() or "2026-09"
          assert re.match(r"^\d{4}-\d{2}$", s) and re.match(r"^\d{4}-\d{2}$", e)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"start={s}\nend={e}\n")
          PY
      - uses: actions/cache@v4
        with:
          path: data/klines
          key: klines-ETHUSDT-${{ steps.args.outputs.start }}-${{ steps.args.outputs.end }}
          restore-keys: klines-ETHUSDT-
      - run: eth-agent fetch --symbol ETHUSDT --start ${{ steps.args.outputs.start }} --end ${{ steps.args.outputs.end }}
      - name: Сітка
        run: |
          mkdir -p reports
          eth-agent grid --start ${{ steps.args.outputs.start }} --end ${{ steps.args.outputs.end }} --summary-md reports/grid.md
          cat reports/grid.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          t = open("reports/grid.md", encoding="utf-8").read()
          for i, part in enumerate(t.split("## Сітковий бот")[1:]):
              rows = [l for l in part.splitlines() if l.startswith("| ") or l.startswith("Капітал")]
              print(f"::notice title=Сітка {i + 1}::" + "%0A".join(rows)[:3900])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grid-report
          path: reports/
