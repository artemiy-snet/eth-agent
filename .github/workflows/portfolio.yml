name: portfolio

# З телефону: Actions → portfolio → Run workflow. Порівняння портфелів у Summary запуску.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Початок, YYYY-MM"
        required: false
        default: "2019-01"
      end:
        description: "Кінець, YYYY-MM"
        required: false
        default: "2026-09"
      pair:
        description: "Пара"
        type: choice
        options: [ETHUSDT, BTCUSDT, SOLUSDT, BNBUSDT]
        default: ETHUSDT
      preset:
        description: "Портфель"
        type: choice
        options: [base, macro, sweep, поточний, обережний, збалансований, агресивний, лише_режим]
        default: base

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[research]"
      - name: Період
        id: args
        env:
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          python - <<'PY'
          import os, re
          s, e = os.environ["IN_START"].strip() or "2019-01", os.environ["IN_END"].strip() or "2026-09"
          assert re.match(r"^\d{4}-\d{2}$", s) and re.match(r"^\d{4}-\d{2}$", e)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"start={s}\nend={e}\n")
          PY
      - uses: actions/cache@v4
        with:
          path: data/klines
          key: klines-${{ inputs.pair }}-${{ steps.args.outputs.start }}-${{ steps.args.outputs.end }}
          restore-keys: klines-${{ inputs.pair }}-
      - run: eth-agent fetch --symbol ${{ inputs.pair }} --start ${{ steps.args.outputs.start }} --end ${{ steps.args.outputs.end }}
      - name: Портфелі
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          mkdir -p reports
          eth-agent portfolio --config config.example.yaml --start ${{ steps.args.outputs.start }} \
            --end ${{ steps.args.outputs.end }} --preset "$PRESET" --pair "${{ inputs.pair }}" --summary-md reports/portfolio.md
          cat reports/portfolio.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          t = open("reports/portfolio.md", encoding="utf-8").read().splitlines()
          chunk, n = [], 0
          for line in t + [None]:
              if line is None or sum(len(x) + 3 for x in chunk) + len(line) > 3500:
                  n += 1
                  print(f"::notice title=Портфелі {n}::" + "%0A".join(chunk))
                  chunk = []
              if line is not None:
                  chunk.append(line)
          PY
