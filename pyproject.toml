[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-agent"
version = "0.10.4b1"
description = "ETH-Агент: спотовий агент ETHUSDT на логіці «точок дії» CryptoBot v2.02"
requires-python = ">=3.12"
# Ядро (живий агент) — лише pyyaml, щоб ставилось у Termux на Android без компіляції.
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Бектест, walk-forward, завантаження історії
research = ["pydantic>=2.6", "pandas>=2.2", "pyarrow>=15", "httpx>=0.27", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
eth-agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
"agent.live" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
