# /etc/nginx/sites-available/criptobot  (setup.sh підставляє домен замість DOMAIN)
limit_req_zone $binary_remote_addr zone=criptochat:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;
    root /var/www/criptobot;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /kb/ { deny all; }

    location /api/ {
        limit_req zone=criptochat burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 400k;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
